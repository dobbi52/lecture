<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 슬라이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap">
<style>
:root{--ink:#1F1B3A;--paper:#F7F5EF;--card:#FFFEFA;--soft:#55526B;--orange:#FF7A3D;--yellow:#FFC93C;--mint:#2FB39A}
*{margin:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',Arial,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:72px 24px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.tag{font-family:'Press Start 2P','Courier New',monospace;font-size:14px;letter-spacing:2px;color:#C2410C}
.pix{display:flex;gap:6px}.pix i{display:block;width:14px;height:14px}
h1{font-size:clamp(40px,6vw,64px);font-weight:900;letter-spacing:-1px;margin-top:20px}
.lead{font-size:20px;color:var(--soft);margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:32px;margin-top:56px}
a.card{display:flex;flex-direction:column;gap:16px;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--ink);outline:none}
.bar{height:12px;border:3px solid var(--ink)}
.date{font-size:17px;font-weight:700;color:var(--soft);letter-spacing:0}
.title{font-size:28px;font-weight:900;line-height:1.3}
.aud{align-self:flex-start;font-size:15px;font-weight:700;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:8px}
.go{margin-top:auto;font-weight:700;font-size:16px}
.empty{margin-top:56px;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="tag">LECTURES</p>
    <div class="pix"><i style="background:var(--orange)"></i><i style="background:var(--yellow)"></i><i style="background:var(--mint)"></i></div>
  </div>
  <h1>강의 슬라이드</h1>
  <p class="lead">볼 강의를 골라 주세요. 슬라이드에서는 → 키로 넘기고 F 키로 전체 화면을 켭니다.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="lectures.js"></script>
<script>
(function(){
  var g=document.getElementById('grid'), list=window.LECTURES||[];
  if(!list.length){g.outerHTML='<p class="empty">아직 등록된 강의가 없습니다.</p>';return}
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  g.innerHTML=list.map(function(l){
    return '<a class="card" href="'+esc(l.path)+'">'+
      '<div class="bar" style="background:'+esc(l.color||'#FFC93C')+'"></div>'+
      '<p class="date">'+esc(l.date)+'</p>'+
      '<p class="title">'+esc(l.title)+'</p>'+
      '<p class="aud">'+esc(l.audience)+'</p>'+
      '<p class="go">슬라이드 열기 →</p></a>';
  }).join('');
})();
</script>
</body>
</html>
